name: Rust maintenance

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format all
        run: cargo fmt --all

      - name: git User config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit format
        run: |
          git add .

          if git diff --cached --quiet; then
            echo "No maintenance changes to commit."
          else
            git commit -m "Executed cargo fmt --all"
            git push
          fi

      - name: Clippy fix
        run: cargo clippy --fix --lib -p textforge

      - name: Commit clippy
        run: |
          git add .

          if git diff --cached --quiet; then
            echo "No maintenance changes to commit."
          else
            git commit -m "Executed cargo clippy --fix --lib -p textforge"
            git push
          fi

      - name: Test
        run: cargo test --features test_access,bytecode --release

      - name: Publish
        if: success()
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish
